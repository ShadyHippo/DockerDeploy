# docker-deploy — run audited deploy scripts by name.
#
#   docker compose pull            use the published image
#   docker compose up -d --build   build from this checkout instead
#
# The allowlist is this directory's ./scripts, mounted read-only. Adding a .sh
# there is live on the next request: no restart, no registry of names.
#
# Host layout used by the defaults:
#
#   /mnt/user/appdata/docker_projects/
#     DockerDeploy/            this checkout
#       scripts/               the allowlist (root-owned, 755)
#       docker/                DOCKER_CONFIG + ghcr.token (gitignored)
#     EasyEdit-Photos/         the stacks
#     ...

services:
  docker-deploy:
    image: ghcr.io/shadyhippo/dockerdeploy:latest
    build: .
    container_name: docker-deploy
    restart: unless-stopped

    # Disposable container: no writable root, no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Reachable from other containers as http://docker-deploy:9000.
    # No ports: published — nothing outside Docker's networks can reach it.
    networks:
      - deploy-net

    volumes:
      # The whole point: the scripts call docker, and this is how they reach
      # the host's daemon. Root-equivalent by design. See README.
      - /var/run/docker.sock:/var/run/docker.sock

      # The allowlist. Only *.sh files are callable, so the README that lives
      # alongside them is ignored. Read-only: a caller can never add or edit
      # what runs.
      - ./scripts:/scripts:ro

      # Where the stacks live, at the same path as on the host so relative
      # binds inside compose files resolve identically. rw because build stacks
      # may `git pull`; tighten to :ro if every stack only pulls.
      - ${PROJECTS_DIR:-/mnt/user/appdata/docker_projects}:${PROJECTS_DIR:-/mnt/user/appdata/docker_projects}:rw

      # Registry login state and the token. On the array, not /root: /root is
      # RAM on Unraid and a login there dies on reboot.
      - ./docker:/root/.docker

    environment:
      SCRIPT_DIR: /scripts
      RUN_TIMEOUT: "1800"
      # same value as the mount above, so scripts can report where they look
      PROJECTS_DIR: ${PROJECTS_DIR:-/mnt/user/appdata/docker_projects}

networks:
  deploy-net:
    name: deploy-net
